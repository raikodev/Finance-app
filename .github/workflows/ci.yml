name: CI

on:
  push:
    branches: [main]
  pull_request:

# Все команды выполняются в папке приложения — корневой package.json
# больше не нужен для сборки (см. finance-app/HANDOFF.md).
defaults:
  run:
    working-directory: finance-app

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finance-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
